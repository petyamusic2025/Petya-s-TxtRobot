name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK építése
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: APK átnevezése
        run: cp app/build/outputs/apk/release/app-release.apk Petya-TxtRobot.apk

      - name: Feltöltés a Releases-be
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Petya TxtRobot 1.0.${{ github.run_number }}
          files: Petya-TxtRobot.apk
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: Petya-TxtRobot
          path: Petya-TxtRobot.apk
